<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed JSFiddle 3D Air Purifier</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #16181c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        h2 {
            margin-bottom: 20px;
            color: #4da6ff;
        }
        .embed-container {
            width: 100%;
            max-width: 900px;
            height: 600px;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #111;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>Realistic Industrial Air Purifier 3D Simulation</h2>

    <!-- Wadah Menggunakan IFRAME yang Lebih Stabil -->
    <div class="embed-container">
        <iframe src="https://jsfiddle.net" allowfullscreen="allowfullscreen" allowpaymentrequest frameborder="0"></iframe>
    </div>

</body>
</html>
