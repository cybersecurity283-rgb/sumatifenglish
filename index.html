<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Industrial Air Purifier 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #eee;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: 260px;
            border: 1px solid #444;
            z-index: 10;
        }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type=range] { width: 100%; cursor: pointer; }
        button {
            width: 100%;
            padding: 8px;
            background: #2b5c8f;
            border: 1px solid #4183c4;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #3876b4; }
    </style>
</head>
<body>
    <div id="ui">
        <h4 style="margin:0 0 12px 0; color: #4da6ff;">System Inspection Controls</h4>
        <div class="control-group">
            <label for="explodeSlider">Explode Assembly</label>
            <input type="range" id="explodeSlider" min="0" max="1" step="0.005" value="0">
        </div>
        <div class="control-group">
            <button id="toggleCutaway">Toggle Shell Cutaway</button>
        </div>
    </div>

    <!-- Include Three.js & OrbitControls dari cdnjs yang kompatibel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/controls/OrbitControls.min.js"></script>

    <script>
        // --- 1. PROCEDURAL TEXTURE GENERATORS ---
        function createNoiseTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(512, 512);
            
            for (let y = 0; y < 512; y++) {
                for (let x = 0; x < 512; x++) {
                    const i = (y * 512 + x) * 4;
                    let v = 0;
                    
                    if (type === 'metal') {
                        v = 170 + Math.random() * 50 - (Math.sin(y / 20) * 15);
                        imgData.data[i] = v - 10;
                        imgData.data[i+1] = v;
                        imgData.data[i+2] = v + 10;
                    } else if (type === 'carbon') {
                        v = Math.random() < 0.35 ? 15 : 50 + Math.random() * 45;
                        imgData.data[i] = v;
                        imgData.data[i+1] = v;
                        imgData.data[i+2] = v;
                    } else if (type === 'hepa') {
                        v = (Math.sin(x * 0.3) > 0) ? 230 : 120;
                        imgData.data[i] = v;
                        imgData.data[i+1] = v - 10;
                        imgData.data[i+2] = v - 20;
                    } else if (type === 'mesh') {
                        v = (x % 16 < 2 || y % 16 < 2) ? 200 : 40;
                        imgData.data[i] = v;
                        imgData.data[i+1] = v;
                        imgData.data[i+2] = v;
                    }
                    imgData.data[i+3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const metalTex = createNoiseTexture('metal');
        metalTex.repeat.set(1, 3);
        const carbonTex = createNoiseTexture('carbon');
        carbonTex.repeat.set(4, 4);
        const hepaTex = createNoiseTexture('hepa');
        hepaTex.repeat.set(8, 1);
        const meshTex = createNoiseTexture('mesh');
        meshTex.repeat.set(6, 6);

        // --- 2. MATERIALS ---
        const steelMat = new THREE.MeshStandardMaterial({
            map: metalTex, roughness: 0.35, metalness: 0.85, side: THREE.DoubleSide
        });
        const darkSteelMat = new THREE.MeshStandardMaterial({
            color: 0x22252a, roughness: 0.5, metalness: 0.7
        });
        const cutawayShellMat = new THREE.MeshStandardMaterial({
            map: metalTex, roughness: 0.4, metalness: 0.8, side: THREE.DoubleSide, transparent: true, opacity: 0.25
        });

        // Filter Layer Materials
        const hepaMat = new THREE.MeshStandardMaterial({ map: hepaTex, roughness: 0.6 });
        const elecMat = new THREE.MeshStandardMaterial({ color: 0x3a4b5c, metalness: 0.9, roughness: 0.2 });
        const synthMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.9 });
        const roughMeshMat = new THREE.MeshStandardMaterial({ map: meshTex, roughness: 0.5, metalness: 0.5 });
        const carbonMat = new THREE.MeshStandardMaterial({ map: carbonTex, roughness: 0.95 });
        const catalystMat = new THREE.MeshStandardMaterial({ map: meshTex, color: 0xb8860b, roughness: 0.4, metalness: 0.6 });

        // --- 3. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x16181c);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4.5, 3.5, 7.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2.2, 0);
        controls.update();

        // --- 4. LIGHTING ---
        scene.add(new THREE.AmbientLight(0xddeeff, 0.6));

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(6, 12, 8);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x80a0ff, 0.4);
        fillLight.position.set(-6, 4, -4);
        scene.add(fillLight);

        // --- 5. HELPER HARDWARE BUILDERS ---
        function createFlangedPipe(radius, length) {
            const group = new THREE.Group();
            const pipeGeo = new THREE.CylinderGeometry(radius, radius, length, 24);
            const pipe = new THREE.Mesh(pipeGeo, steelMat);
            group.add(pipe);

            const flangeGeo = new THREE.CylinderGeometry(radius * 1.35, radius * 1.35, 0.05, 24);
            const f1 = new THREE.Mesh(flangeGeo, steelMat);
            f1.position.y = length / 2 - 0.025;
            const f2 = f1.clone();
            f2.position.y = -length / 2 + 0.025;
            group.add(f1, f2);

            const boltCount = 8;
            for (let i = 0; i < boltCount; i++) {
                const angle = (i / boltCount) * Math.PI * 2;
                const boltGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.08, 8);
                const bolt = new THREE.Mesh(boltGeo, darkSteelMat);
                bolt.position.set(Math.cos(angle) * radius * 1.18, length / 2, Math.sin(angle) * radius * 1.18);
                group.add(bolt);
            }
            return group;
        }

        function createPressureGauge() {
            const group = new THREE.Group();
            const dialGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.04, 16);
            dialGeo.rotateX(Math.PI / 2);
            const dial = new THREE.Mesh(dialGeo, steelMat);
            
            const faceGeo = new THREE.CircleGeometry(0.07, 16);
            const faceMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const face = new THREE.Mesh(faceGeo, faceMat);
            face.position.z = 0.021;
            dial.add(face);

            const stemGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.12, 8);
            const stem = new THREE.Mesh(stemGeo, darkSteelMat);
            stem.position.y = -0.06;
            
            group.add(dial, stem);
            return group;
        }

        // --- 6. MODEL ASSEMBLY ---
        const mainAssembly = new THREE.Group();
        scene.add(mainAssembly);

        // Platform Base
        const platformGeo = new THREE.BoxGeometry(4.2, 0.15, 2.2);
        const platform = new THREE.Mesh(platformGeo, darkSteelMat);
        platform.position.y = 0.075;
        mainAssembly.add(platform);

        const animatedLayers1 = [];
        const animatedLayers2 = [];

        // --- TABUNG 1: AIR PURIFIER ---
        const t1Group = new THREE.Group();
        t1Group.position.set(-1.25, 0, 0);
        mainAssembly.add(t1Group);

        const t1ShellGeo = new THREE.CylinderGeometry(0.55, 0.55, 2.8, 32, 1, true, Math.PI * 0.25, Math.PI * 1.5);
        const t1Shell = new THREE.Mesh(t1ShellGeo, cutawayShellMat);
        t1Shell.position.y = 2.4;
        t1Group.add(t1Shell);

        const coneGeo = new THREE.ConeGeometry(0.58, 0.5, 32);
        const t1TopCone = new THREE.Mesh(coneGeo, steelMat);
        t1TopCone.position.y = 4.05;
        t1Group.add(t1TopCone);

        const hoodGeo = new THREE.ConeGeometry(0.75, 0.3, 32);
        const t1Hood = new THREE.Mesh(hoodGeo, steelMat);
        t1Hood.position.y = 4.45;
        t1Group.add(t1Hood);

        const t1FiltersData = [
            { name: "1. Cyclone / Pre-Filter", mat: steelMat, y: 1.3, isCyclone: true },
            { name: "2. Rough Mesh Filter", mat: roughMeshMat, y: 1.85, h: 0.4 },
            { name: "3. Synthetic Fiber Filter", mat: synthMat, y: 2.35, h: 0.45 },
            { name: "4. Electrostatic Filter", mat: elecMat, y: 2.85, h: 0.35 },
            { name: "5. HEPA Filter", mat: hepaMat, y: 3.35, h: 0.4 }
        ];

        t1FiltersData.forEach((f, idx) => {
            let mesh;
            if (f.isCyclone) {
                mesh = new THREE.Group();
                const core = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.6, 24), steelMat);
                core.rotation.x = Math.PI;
                mesh.add(core);
                for(let v=0; v<3; v++) {
                    const vaneGeo = new THREE.TorusGeometry(0.25, 0.02, 8, 16, Math.PI);
                    const vane = new THREE.Mesh(vaneGeo, darkSteelMat);
                    vane.rotation.x = Math.PI / 2;
                    vane.rotation.z = (v * Math.PI * 2) / 3;
                    vane.position.y = -0.1 + (v * 0.1);
                    mesh.add(vane);
                }
            } else {
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, f.h, 32), f.mat);
            }
            mesh.position.y = f.y;
            mesh.userData = { origY: f.y, index: idx };
            t1Group.add(mesh);
            animatedLayers1.push(mesh);
        });

        // --- TABUNG 2: GAS NEUTRALIZER ---
        const t2Group = new THREE.Group();
        t2Group.position.set(1.25, 0, 0);
        mainAssembly.add(t2Group);

        const t2Shell = new THREE.Mesh(t1ShellGeo, cutawayShellMat);
        t2Shell.position.y = 2.4;
        t2Group.add(t2Shell);

        const t2TopCone = t1TopCone.clone();
        t2TopCone.position.y = 4.05;
        t2Group.add(t2TopCone);

        const t2FiltersData = [
            { name: "1. Reaction Chamber", mat: darkSteelMat, y: 1.3, h: 0.45 },
            { name: "2. Absorption Media (Carbon)", mat: carbonMat, y: 1.85, h: 0.55 },
            { name: "3. Neutralization Catalyst", mat: catalystMat, y: 2.45, h: 0.5 },
            { name: "4. Automation & Processing", mat: elecMat, y: 3.1, h: 0.35 }
        ];

        t2FiltersData.forEach((f, idx) => {
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, f.h, 32), f.mat);
            mesh.position.y = f.y;
            mesh.userData = { origY: f.y, index: idx };
            t2Group.add(mesh);
            animatedLayers2.push(mesh);
        });

        // --- 7. PIPING, VALVES & STRUCTURAL HARDWARE ---
        const inletPipe = createFlangedPipe(0.12, 0.9);
        inletPipe.rotation.z = Math.PI / 2;
        inletPipe.position.set(-1.9, 1.1, 0);
        mainAssembly.add(inletPipe);

        const crossPipe = createFlangedPipe(0.1, 2.3);
        crossPipe.rotation.z = Math.PI / 2;
        crossPipe.position.set(0, 3.75, 0);
        mainAssembly.add(crossPipe);

        const valveGroup = new THREE.Group();
        const valvePipe = createFlangedPipe(0.08, 0.4);
        const wheelGeo = new THREE.TorusGeometry(0.12, 0.02, 8, 16);
        const wheel = new THREE.Mesh(wheelGeo, darkSteelMat);
        wheel.rotation.x = Math.PI / 2;
        wheel.position.y = 0.15;
        valveGroup.add(valvePipe, wheel);
        valveGroup.position.set(1.25, 4.4, 0);
        mainAssembly.add(valveGroup);

        const frameGroup = new THREE.Group();
        const legGeo = new THREE.BoxGeometry(0.06, 3.8, 0.06);
        
        const positions = [-1.8, -0.7, 0.7, 1.8];
        positions.forEach(x => {
            [-0.7, 0.7].forEach(z => {
                const leg = new THREE.Mesh(legGeo, darkSteelMat);
                leg.position.set(x, 2.0, z);
                frameGroup.add(leg);
            });
        });

        const ladderGroup = new THREE.Group();
        for (let r = 0; r < 14; r++) {
            const rung = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.4, 8), darkSteelMat);
            rung.rotation.z = Math.PI / 2;
            rung.position.y = 0.5 + (r * 0.25);
            ladderGroup.add(rung);
        }
        ladderGroup.position.set(1.85, 0, 0);
        mainAssembly.add(ladderGroup);

        const boxGeo = new THREE.BoxGeometry(0.3, 0.4, 0.2);
        const controlBox = new THREE.Mesh(boxGeo, darkSteelMat);
        controlBox.position.set(0, 1.2, 0.7);
        mainAssembly.add(controlBox);

        const gauge1 = createPressureGauge();
        gauge1.position.set(-1.25, 2.8, 0.58);
        mainAssembly.add(gauge1);

        const gauge2 = createPressureGauge();
        gauge2.position.set(1.25, 3.3, 0.58);
        mainAssembly.add(gauge2);

        // --- 8. INTERACTIVE UI LOGIC ---
        const explodeSlider = document.getElementById('explodeSlider');
        explodeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            
            animatedLayers1.forEach(m => {
                m.position.y = m.userData.origY + (m.userData.index * val * 0.65);
            });

            animatedLayers2.forEach(m => {
                m.position.y = m.userData.origY + (m.userData.index * val * 0.65);
            });
        });

        let isCutaway = true;
        document.getElementById('toggleCutaway').addEventListener('click', () => {
            isCutaway = !isCutaway;
            t1Shell.material = isCutaway ? cutawayShellMat : steelMat;
            t2Shell.material = isCutaway ? cutawayShellMat : steelMat;
        });

        // --- 9. RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
